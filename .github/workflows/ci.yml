name: Verify HabitFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: cp .dev.vars.example .dev.vars
      - run: npm run db:migrate
      - run: npm run test:smoke
